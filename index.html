<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>富國島考察行程｜11/23–11/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --card:#FFFFFF;
  --coral:#F2A497; --yellow:#F6D27A; --water:#A8D3E6; --green:#B9DAA5;
  --coral-l:#FCE6E1; --yellow-l:#FDF3D6; --water-l:#E5F2F8; --green-l:#EAF4E3;
  --line:3px solid var(--ink); --r:22px; --r-s:14px;
  --shadow:4px 4px 0 var(--ink);
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;
  padding-top:calc(var(--nav-h) + env(safe-area-inset-top));
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
svg{display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ===== 頂端選單 ===== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--paper);border-bottom:var(--line);
  padding-top:env(safe-area-inset-top);
}
.nav-inner{max-width:720px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{display:flex;align-items:center;gap:6px;font-size:18px;flex-shrink:0;text-decoration:none;color:inherit}
.brand svg{width:30px;height:30px}
.nav-links{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;margin-left:auto}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  flex-shrink:0;text-decoration:none;color:var(--ink);font-size:14px;
  padding:4px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);
  transition:background .2s,transform .2s;
}
.nav-links a.on{background:var(--yellow);transform:translateY(-1px)}

/* ===== 共用 ===== */
section{padding:28px 0 8px;scroll-margin-top:calc(var(--nav-h) + 12px)}
.sec-title{display:flex;align-items:center;gap:10px;font-size:22px;margin-bottom:14px;font-weight:400}
.sec-title .ic{width:40px;height:40px;flex-shrink:0}
.sec-title small{font-size:14px;margin-left:auto;opacity:.75}
.card{background:var(--card);border:var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.muted{opacity:.72;font-size:14px}

/* ===== 首頁 ===== */
.hero{padding-top:18px}
.hero-art{
  border:var(--line);border-radius:28px;overflow:hidden;background:var(--water-l);box-shadow:var(--shadow);
}
.hero-art svg{width:100%;height:auto}
.hero-text{text-align:center;margin:22px 0 6px}
.hero-text .kicker{
  display:inline-block;font-size:14px;padding:3px 14px;border:2.5px solid var(--ink);
  border-radius:999px;background:var(--green);
}
.hero-text h1{font-size:34px;font-weight:400;line-height:1.3;margin:10px 0 2px;letter-spacing:.04em}
.hero-text p{font-size:15px}
.count{margin-top:18px;text-align:center}
.count-label{font-size:15px;margin-bottom:10px}
.count-boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cbox{border:var(--line);border-radius:var(--r-s);padding:10px 4px 6px;background:var(--card)}
.cbox:nth-child(1){background:var(--coral-l)}
.cbox:nth-child(2){background:var(--yellow-l)}
.cbox:nth-child(3){background:var(--water-l)}
.cbox:nth-child(4){background:var(--green-l)}
.cbox b{display:block;font-size:30px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.cbox span{font-size:13px}
.count-msg{font-size:20px;padding:14px;border:var(--line);border-radius:var(--r-s);background:var(--yellow-l)}
.notes{margin-top:16px;display:grid;gap:8px;font-size:14px}
.notes div{display:flex;gap:8px;align-items:flex-start}
.dot{width:14px;height:14px;border:2.5px solid var(--ink);border-radius:50%;flex-shrink:0;margin-top:4px}

/* ===== 航班 ===== */
.flights{display:grid;gap:16px}
@media(min-width:640px){.flights{grid-template-columns:1fr 1fr}}
.flight{padding:0;overflow:hidden}
.flight-top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:var(--line)}
.flight.go .flight-top{background:var(--coral)}
.flight.back .flight-top{background:var(--water)}
.flight-top .no{font-size:20px}
.flight-body{padding:16px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.port b{display:block;font-size:30px;font-weight:400;line-height:1.1;letter-spacing:.05em}
.port .t{font-size:22px}
.port small{display:block;font-size:13px;opacity:.75}
.flight-mid{width:86px}
.flight-foot{border-top:2.5px dashed var(--ink);padding:10px 18px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px}

/* ===== 天氣 ===== */
.wx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wx{border:var(--line);border-radius:var(--r-s);background:var(--card);text-align:center;padding:8px 2px 8px;line-height:1.3}
.wx:nth-child(5n+1){background:var(--coral-l)}
.wx:nth-child(5n+2){background:var(--yellow-l)}
.wx:nth-child(5n+3){background:var(--water-l)}
.wx:nth-child(5n+4){background:var(--green-l)}
.wx:nth-child(5n+5){background:var(--coral-l)}
.wx .d{font-size:14px}
.wx .w{font-size:12px}
.wx svg{width:44px;height:44px;margin:4px auto 2px}
.wx .desc{font-size:12px;white-space:nowrap;letter-spacing:-.02em}
.wx .hi{font-size:19px;display:block;font-variant-numeric:tabular-nums}
.wx .lo{font-size:13px;opacity:.75}
.wx .rain{display:inline-block;margin-top:4px;font-size:12px;padding:0 6px;border:2px solid var(--ink);border-radius:999px;background:var(--water)}
.wx-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center;margin-bottom:12px}
.wx-src{font-size:12.5px;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.wx-tips{margin-top:14px;display:grid;gap:6px;font-size:14px}
.wx-tips div{padding:6px 10px;border:2px dashed var(--ink);border-radius:12px;background:var(--paper)}
.wx-chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:1px 10px 1px 4px;border:2px solid var(--ink);border-radius:999px;background:var(--water-l);margin-top:4px}
.wx-chip svg{width:22px;height:22px}
.wx-refresh{font-size:13px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow)}

/* ===== 每日行程 ===== */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.day-btn{
  border:var(--line);border-radius:var(--r-s);background:var(--card);padding:8px 2px 6px;text-align:center;
  transition:transform .15s,background .2s,box-shadow .15s;line-height:1.25;
}
.day-btn b{display:block;font-size:19px;font-weight:400}
.day-btn span{font-size:12px}
.day-btn[aria-selected="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}
.day-btn:active{transform:scale(.95)}
.day-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.day-head .art{width:84px;height:84px;flex-shrink:0;border:var(--line);border-radius:20px;background:var(--water-l);overflow:hidden}
.day-head h3{font-size:21px;font-weight:400;line-height:1.35}
.day-head p{font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}

.tl{list-style:none;position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl li{position:relative;margin-bottom:14px}
.tl li::before{
  content:"";position:absolute;left:-28px;top:16px;width:16px;height:16px;border-radius:50%;
  border:3px solid var(--ink);background:var(--paper);
}
.tl li.star::before{background:var(--coral)}
.tl li.booked::before{background:var(--yellow)}
.item{background:var(--card);border:var(--line);border-radius:18px;padding:12px 14px}
.tl li.star .item{background:var(--coral-l)}
.tl li.booked .item{background:var(--yellow-l)}
.item-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.time{font-size:14px;padding:1px 10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-variant-numeric:tabular-nums}
.item h4{font-size:17px;font-weight:400;line-height:1.45}
.place{font-size:14px;margin-top:3px;display:flex;gap:4px;align-items:flex-start}
.place svg{width:16px;height:16px;flex-shrink:0;margin-top:3px}
.note{font-size:13.5px;margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--paper);border:2px dashed var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12.5px;padding:1px 9px;border:2px solid var(--ink);border-radius:999px;display:inline-flex;align-items:center;gap:4px;line-height:1.5}
.tag.plane{background:var(--coral)}
.tag.bus{background:var(--water)}
.tag.cable{background:var(--yellow)}
.tag.walk{background:var(--green)}
.tag.must{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.booked{background:var(--yellow)}

/* 切換日期彈跳 */
.bounce-in{animation:bounceIn .55s cubic-bezier(.3,1.6,.5,1) both}
.tl li.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bounceIn{0%{transform:scale(.85) translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}100%{transform:none;opacity:1}}

/* ===== 清單 ===== */
.check-card{padding:8px 16px 12px}
.check-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 10px;border-bottom:2.5px dashed var(--ink);margin-bottom:4px}
.check-head h3{font-size:18px;font-weight:400}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-right:2.5px solid var(--ink);transition:width .4s}
.bar i[style*="width: 0%"]{border-right:none}
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chk input{position:absolute;opacity:0;pointer-events:none}
.box{
  width:26px;height:26px;flex-shrink:0;border:3px solid var(--ink);border-radius:9px;background:var(--card);
  display:grid;place-items:center;transition:background .2s,transform .2s;
}
.box svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.chk input:checked + .box{background:var(--green);transform:rotate(-6deg)}
.chk input:checked + .box svg{opacity:1;transform:scale(1)}
.chk input:focus-visible + .box{outline:3px solid var(--coral);outline-offset:2px}
.chk .txt{flex:1}
.chk .txt small{display:block;font-size:13px;opacity:.72}
.chk input:checked ~ .txt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.5}
.group-label{font-size:14px;margin:12px 0 2px;display:inline-block;padding:0 10px;border:2px solid var(--ink);border-radius:999px}
.reset{font-size:13px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}

/* 住宿 */
.stay{display:grid;gap:16px}
.stay-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.stay-card .art{width:76px;height:76px;border:var(--line);border-radius:18px;background:var(--yellow-l);overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px;margin-top:6px}
.kv dt{opacity:.7}
.pending{display:inline-block;font-size:12.5px;padding:0 8px;border:2px dashed var(--ink);border-radius:999px;background:var(--paper)}

footer{text-align:center;padding:36px 0 48px;font-size:13px}
footer svg{width:120px;margin:0 auto 6px}

/* ===== 插圖動畫 ===== */
.float{animation:float 4s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 3s ease-in-out infinite}
.drift{animation:drift 26s linear infinite}
.drift2{animation:drift 34s linear infinite;animation-delay:-14s}
.wave{animation:wave 6s linear infinite}
.wave2{animation:wave 9s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:50% 50%;animation:bob 3.2s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
.cable-move{animation:cable 12s ease-in-out infinite alternate}
.plane-fly{animation:planeFly 7s ease-in-out infinite}
.buzz{transform-box:fill-box;transform-origin:50% 50%;animation:buzz 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes drift{0%{transform:translateX(-120px)}100%{transform:translateX(480px)}}
@keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cable{0%{transform:translate(0,0)}100%{transform:translate(118px,-34px)}}
@keyframes planeFly{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(10px,-8px) rotate(2deg)}}
@keyframes buzz{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-4px)}50%{transform:translate(-2px,-6px)}75%{transform:translate(-4px,-2px)}}

/* 減少動態效果 */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<main class="wrap">

<!-- ===== 首頁 ===== -->
<section id="home" class="hero">
  <div class="hero-art">
    <svg viewBox="0 0 360 230" role="img" aria-label="富國島插圖：海上小島、椰子樹、跨海纜車與飛機">
      <!-- 太陽 -->
      <g transform="translate(300 52)">
        <g class="spin">
          <g stroke="#3E3A39" stroke-width="3" stroke-linecap="round">

        </g>
        <circle r="19" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
        <circle cx="-7" cy="-2" r="2" fill="#3E3A39"/><circle cx="7" cy="-2" r="2" fill="#3E3A39"/>

      </g>

        <path d="M-10 12 h-14 M-8 4 h-10" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      </g></g>
      <!-- 纜車塔與鋼索 -->
      <line x1="150" y1="158" x2="330" y2="104" stroke="#3E3A39" stroke-width="2.5"/>
      <path d="M318 168 l8 -66 h6 l8 66z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>

        <rect x="0" y="10" width="24" height="20" rx="7" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
        <rect x="5" y="14" width="14" height="7" rx="3" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.2"/>
      </g></g></g>
      <!-- 小島 -->
      <path d="M40 182 q20 -46 70 -46 q46 0 70 46z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 186 q40 -18 160 0z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <!-- 胡椒小點點 -->
      <circle cx="80" cy="166" r="3" fill="#F2A497" stroke="#3E3A39" stroke-width="2"/>
      <circle cx="90" cy="160" r="3" fill="#F2A497" stroke="#3E3A39" stroke-width="2"/>
      <circle cx="148" cy="166" r="3" fill="#F2A497" stroke="#3E3A39" stroke-width="2"/>
      <!-- 椰子樹 -->
      <g class="sway" transform="translate(0 0)">
        <path d="M112 176 q-4 -36 6 -62" fill="none" stroke="#3E3A39" stroke-width="7" stroke-linecap="round"/>
        <path d="M112 176 q-4 -36 6 -62" fill="none" stroke="#F6D27A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
        <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" fill="#B9DAA5">
          <path d="M118 114 q-22 -14 -40 2 q20 -4 40 -2z"/>
          <path d="M118 114 q-14 -24 -34 -18 q18 4 34 18z"/>
          <path d="M118 114 q18 -22 40 -12 q-22 2 -40 12z"/>
          <path d="M118 114 q24 -4 34 14 q-18 -10 -34 -14z"/>
          <path d="M118 114 q2 -24 18 -30 q-10 14 -18 30z"/>
        </g>
        <circle cx="114" cy="118" r="4" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
        <circle cx="122" cy="119" r="4" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
      </g>

/* ---------- 天氣（Open-Meteo，免金鑰；抓不到時改顯示歷年平均） ---------- */
const WXCFG = { lat:10.2167, lon:103.9667, tz:"Asia/Ho_Chi_Minh" }; // 陽東 Dương Đông
const isoOf = md => { const [m,d] = md.split("/"); return `2026-${m.padStart(2,"0")}-${d.padStart(2,"0")}`; };
const tripISO = TRIP.days.map(d=>isoOf(d.date));
let WX = null; // { src:"live"|"cache"|"normal", at, days:[{code,hi,lo,rain,uv}] }

function wxKind(c){
  if(c===0) return ["sun","晴天"];
  if(c<=2) return ["partly","晴時多雲"];
  if(c===3) return ["cloud","陰天"];
  if(c===45||c===48) return ["cloud","有霧"];
  if(c>=95) return ["storm","雷雨"];
  if(c>=80) return ["shower","陣雨"];
  if(c>=51) return ["rain","下雨"];
  return ["partly","晴時多雲"];
}
const WXI = {
  sun:`<svg viewBox="0 0 48 48" aria-hidden="true"><g class="spin"><g stroke="#3E3A39" stroke-width="3" stroke-linecap="round"><line x1="24" y1="3" x2="24" y2="9"/><line x1="24" y1="39" x2="24" y2="45"/><line x1="3" y1="24" x2="9" y2="24"/><line x1="39" y1="24" x2="45" y2="24"/><line x1="9" y1="9" x2="13" y2="13"/><line x1="35" y1="35" x2="39" y2="39"/><line x1="9" y1="39" x2="13" y2="35"/><line x1="35" y1="13" x2="39" y2="9"/></g></g><circle cx="24" cy="24" r="10" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/></svg>`,
  partly:`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="18" cy="17" r="9" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/><g class="float"><path d="M15 40 q-8 0 -8 -7 q0 -7 8 -7 q2 -7 10 -7 q9 0 10 8 q7 0 7 6.5 q0 6.5 -7 6.5z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g></svg>`,
  cloud:`<svg viewBox="0 0 48 48" aria-hidden="true"><g class="float"><path d="M13 38 q-9 0 -9 -8 q0 -8 9 -8 q2 -9 12 -9 q11 0 12 10 q8 0 8 7.5 q0 7.5 -8 7.5z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g></svg>`,
  shower:`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="16" cy="13" r="8" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/><g class="float"><path d="M13 32 q-8 0 -8 -7 q0 -7 8 -7 q2 -7 10 -7 q9 0 10 8 q7 0 7 6.5 q0 6.5 -7 6.5z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g><g stroke="#A8D3E6" stroke-width="3.5" stroke-linecap="round"><line x1="16" y1="37" x2="14" y2="43"/><line x1="26" y1="37" x2="24" y2="43"/><line x1="36" y1="37" x2="34" y2="43"/></g></svg>`,
  rain:`<svg viewBox="0 0 48 48" aria-hidden="true"><g class="float"><path d="M13 30 q-9 0 -9 -8 q0 -8 9 -8 q2 -9 12 -9 q11 0 12 10 q8 0 8 7.5 q0 7.5 -8 7.5z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g><g stroke="#3E3A39" stroke-width="3" stroke-linecap="round"><line x1="14" y1="35" x2="12" y2="42"/><line x1="24" y1="35" x2="22" y2="42"/><line x1="34" y1="35" x2="32" y2="42"/></g></svg>`,
  storm:`<svg viewBox="0 0 48 48" aria-hidden="true"><g class="float"><path d="M13 30 q-9 0 -9 -8 q0 -8 9 -8 q2 -9 12 -9 q11 0 12 10 q8 0 8 7.5 q0 7.5 -8 7.5z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g><path d="M25 30 l-6 9 h6 l-3 7 l9 -11 h-6 l3 -5z" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/></svg>`
};

function wxChip(i){
  if(!WX || !WX.days[i]) return "";
  const x = WX.days[i], [k,t] = wxKind(x.code);
  const est = WX.src==="normal";
  return `<span class="wx-chip">${WXI[k]}${t}・${est?"約 ":""}${x.lo}–${x.hi}°C${x.rain!=null?`・☔ ${x.rain}%`:""}</span>`;
}
function renderWx(){
  const g = $("#wxGrid");
  if(!WX){ g.innerHTML = `<p class="muted" style="grid-column:1/-1">天氣讀取中…</p>`; return; }
  const est = WX.src==="normal";
  g.innerHTML = TRIP.days.map((d,i)=>{
    const x = WX.days[i], [k,t] = wxKind(x.code);
    return `<div class="wx"><div class="d">${esc(d.date)}</div><div class="w">週${esc(d.wd)}</div>${WXI[k]}
      <div class="desc">${t}</div><span class="hi">${est?"~":""}${x.hi}°</span><span class="lo">${est?"~":""}${x.lo}°</span>
      ${x.rain!=null?`<div><span class="rain">☔ ${x.rain}%</span></div>`:""}</div>`;
  }).join("");
  const at = WX.at ? new Date(WX.at).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}) : "";
  $("#wxSrc").textContent = WX.src==="live" ? `即時預報・${at} 更新`
    : WX.src==="cache" ? `離線中，顯示 ${at} 的預報`
    : "尚無預報，顯示 11 月歷年平均";
  // 小提醒
  const tips = [];
  const maxRain = Math.max(...WX.days.map(x=>x.rain??0));
  const rainy = TRIP.days.filter((d,i)=>(WX.days[i].rain??0)>=50).map(d=>d.date);
  if(est){
    tips.push("🌦 11 月是雨季轉乾季，常見午後短暫陣雨，雨具帶著比較安心。");
    tips.push("🌡 白天約 29–30°C、晚上約 24–25°C，濕度高，衣物以透氣為主。");
  }else{
    if(rainy.length) tips.push(`☔ ${rainy.join("、")} 降雨機率較高，記得帶傘或輕便雨衣。`);
    else if(maxRain>=30) tips.push("🌦 有機會短暫陣雨，包裡放把折傘就好。");
    else tips.push("☀️ 降雨機率不高，戶外考察很適合。");
    const maxUV = Math.max(...WX.days.map(x=>x.uv??0));
    if(maxUV>=8) tips.push(`🧴 紫外線指數最高約 ${Math.round(maxUV)}，防曬、帽子、太陽眼鏡要準備。`);
    const hot = Math.max(...WX.days.map(x=>x.hi));
    if(hot>=32) tips.push(`🥵 最高溫約 ${hot}°C，戶外行程多補水。`);
  }
  tips.push("🧥 室內冷氣強、纜車上風大，帶件薄外套。");
  $("#wxTips").innerHTML = tips.map(t=>`<div>${esc(t)}</div>`).join("");
  const dw = $("#dayWx"); if(dw) dw.innerHTML = wxChip(curDay);
}
async function loadWx(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${WXCFG.lat}&longitude=${WXCFG.lon}`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max`+
    `&timezone=${encodeURIComponent(WXCFG.tz)}&start_date=${tripISO[0]}&end_date=${tripISO[tripISO.length-1]}`;
  try{
    const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 10000);
    const r = await fetch(url, {signal:ctrl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(), D = j.daily;
    const days = tripISO.map(iso=>{
      const k = D.time.indexOf(iso); if(k<0) throw new Error("no date");
      if(D.temperature_2m_max[k]==null) throw new Error("no data");
      return { code:D.weather_code[k], hi:Math.round(D.temperature_2m_max[k]), lo:Math.round(D.temperature_2m_min[k]),
               rain:D.precipitation_probability_max[k], uv:D.uv_index_max[k] };
    });
    WX = { src:"live", at:Date.now(), days };
    store.set("pq-wx", WX);
  }catch(e){
    const c = store.get("pq-wx");
    if(c && c.days && c.days.length===TRIP.days.length) WX = { ...c, src:"cache" };
    else WX = { src:"normal", at:null, days:TRIP.days.map(()=>({ code:2, hi:30, lo:24, rain:null, uv:null })) };
  }
  renderWx();
}
$("#wxRefresh").addEventListener("click", ()=>{ $("#wxSrc").textContent="讀取中…"; loadWx(); });

/* ---------- 每日行程 ---------- */
let curDay = 0;
const tabs = $("#dayTabs"), panel = $("#dayPanel");
tabs.innerHTML = TRIP.days.map((d,i)=>`
  <button class="day-btn" role="tab" id="tab${i}" aria-controls="dayPanel" aria-selected="false" data-i="${i}">
    <b>${esc(d.date)}</b><span>週${esc(d.wd)}・D${i+1}</span>
  </button>`).join("");

function renderDay(i, animate){
  const d = TRIP.days[i]; curDay = i;
  tabs.querySelectorAll(".day-btn").forEach((b,j)=>{
    b.setAttribute("aria-selected", j===i ? "true":"false");
    b.tabIndex = j===i ? 0 : -1;
  });
  const stars = d.items.filter(x=>x.star).length;
  panel.setAttribute("aria-labelledby","tab"+i);
  panel.innerHTML = `
    <div class="day-head ${animate?'bounce-in':''}">
      <div class="art">${ART[d.art]||""}</div>
      <div><p>Day ${i+1}・${esc(d.date)}（${esc(d.wd)}）</p><h3>${esc(d.title)}</h3>
      <p>${d.items.length} 個行程${stars?`・★ ${stars} 項`:""}</p><div id="dayWx">${wxChip(i)}</div></div>
    </div>
    <ol class="tl">${d.items.map((x,k)=>`
      <li class="${x.star?'star':''} ${x.booked?'booked':''} ${animate?'pop':''}" style="${animate?`animation-delay:${k*60}ms`:''}">
        <div class="item">
          <div class="item-top"><span class="time">${esc(x.t)}</span>
            ${x.star?'<span class="tag must" aria-label="重要項目">★</span>':''}${x.booked?'<span class="tag booked">已預訂</span>':''}</div>
          <h4>${esc(x.title)}</h4>
          ${x.place?`<div class="place">${PIN}<span>${esc(x.place)}</span></div>`:''}
          ${x.note?`<div class="note">${esc(x.note)}</div>`:''}
          ${x.tags&&x.tags.length?`<div class="tags">${x.tags.map(t=>`<span class="tag ${t}">${TAG[t]||t}</span>`).join("")}</div>`:''}
        </div>
      </li>`).join("")}
    </ol>`;
  store.set("pq-day", i);
}
tabs.addEventListener("click", e=>{
  const b = e.target.closest(".day-btn"); if(!b) return;
  renderDay(+b.dataset.i, true);
});
tabs.addEventListener("keydown", e=>{
  const cur = +document.activeElement.dataset.i; if(isNaN(cur)) return;
  let n = null;
  if(e.key==="ArrowRight") n = (cur+1)%TRIP.days.length;
  if(e.key==="ArrowLeft") n = (cur-1+TRIP.days.length)%TRIP.days.length;
  if(n!==null){ e.preventDefault(); renderDay(n,true); $("#tab"+n).focus(); }
});
// 旅途中自動跳到當天
(function initDay(){
  const now = new Date();
  const md = `${now.getMonth()+1}/${now.getDate()}`;
  let idx = TRIP.days.findIndex(d=>d.date===md && now.getFullYear()===2026);
  if(idx<0){ const saved = store.get("pq-day"); idx = (Number.isInteger(saved) && saved < TRIP.days.length) ? saved : 0; }
  renderDay(idx, false);
})();

/* ---------- 住宿 ---------- */
const HOTEL = `<svg viewBox="0 0 76 76"><rect width="76" height="76" fill="#FDF3D6"/>
  <g class="sway"><path d="M60 64 q-2 -16 2 -26" fill="none" stroke="#3E3A39" stroke-width="4" stroke-linecap="round"/>
  <path d="M62 38 q-10 -8 -18 0 q8 -2 18 0z M62 38 q8 -10 16 -4 q-8 0 -16 4z M62 38 q0 -10 8 -14 q-4 6 -8 14z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/></g>
  <rect x="10" y="28" width="38" height="38" rx="6" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
  <path d="M6 30 l23 -16 l23 16z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
  <rect x="16" y="36" width="9" height="9" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.4"/>
  <rect x="33" y="36" width="9" height="9" rx="2" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.4"/>
  <rect x="24" y="52" width="10" height="14" rx="2" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.4"/></svg>`;
const val = v => /待更新|未定/.test(v) ? `<span class="pending">${esc(v)}</span>` : esc(v);

/* ---------- 可打勾清單 ---------- */
const CHECK = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 l3.2 3 l6.8 -7" fill="none" stroke="#3E3A39" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function renderList(key){
  const L = TRIP.lists[key], saved = store.get("pq-"+key) || {};
  let n = 0;
  const html = L.groups.map(g=>`
    ${g.label?`<span class="group-label" style="background:${g.color}">${esc(g.label)}</span>`:''}
    ${g.items.map(it=>{ const id = key+"-"+(n++); return `
      <label class="chk"><input type="checkbox" data-id="${id}" ${saved[id]?'checked':''}>
        <span class="box">${CHECK}</span>
        <span class="txt">${esc(it.t)}${it.s?`<small>${esc(it.s)}</small>`:''}</span></label>`;}).join("")}`).join("");
  const el = $("#list-"+key);
  el.innerHTML = `<div class="card check-card">
    <div class="check-head"><h3>${esc(L.title)}・<span class="prog">0/${n}</span></h3><button class="reset" type="button">全部清除</button></div>
    <div class="bar" aria-hidden="true"><i style="width:0%"></i></div>${html}</div>`;
  const update = ()=>{
    const boxes = [...el.querySelectorAll("input")], done = boxes.filter(b=>b.checked).length;
    el.querySelector(".prog").textContent = `${done}/${boxes.length}${done===boxes.length?' 完成！':''}`;
    el.querySelector(".bar i").style.width = (boxes.length? done/boxes.length*100 : 0)+"%";
  };
  el.addEventListener("change", e=>{
    if(e.target.type!=="checkbox") return;
    const s = store.get("pq-"+key) || {}; s[e.target.dataset.id] = e.target.checked; store.set("pq-"+key, s); update();
  });
  el.querySelector(".reset").addEventListener("click", ()=>{
    el.querySelectorAll("input").forEach(b=>b.checked=false); store.set("pq-"+key,{}); update();
  });
  update();
}
["todo","prep","pack"].forEach(renderList);
renderWx(); loadWx();

/* ---------- 倒數 ---------- */
const dep = new Date(TRIP.departISO).getTime(), ret = new Date(TRIP.returnISO).getTime();
function tick(){
  const now = Date.now();
  if(now < dep){
    let s = Math.floor((dep-now)/1000);
    $("#cd-d").textContent = Math.floor(s/86400); s%=86400;
    $("#cd-h").textContent = String(Math.floor(s/3600)).padStart(2,"0"); s%=3600;
    $("#cd-m").textContent = String(Math.floor(s/60)).padStart(2,"0");
    $("#cd-s").textContent = String(s%60).padStart(2,"0");
    return;
  }
  $("#countBoxes").hidden = true; $("#countLabel").hidden = true;
  const m = $("#countMsg"); m.hidden = false;
  m.textContent = now < ret ? "🌴 旅途進行中，考察順利！" : "🏠 歡迎回家，辛苦了！";
}
tick(); setInterval(tick, 1000);

/* ---------- 選單高亮 ---------- */
const links = [...document.querySelectorAll("#navLinks a")];
if("IntersectionObserver" in window){
  const io = new IntersectionObserver(es=>{
    es.forEach(en=>{ if(en.isIntersecting){
      links.forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id));
      const on = links.find(a=>a.classList.contains("on"));
      if(on) on.scrollIntoView({block:"nearest", inline:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    }});
  }, {rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("main section").forEach(s=>io.observe(s));
}
